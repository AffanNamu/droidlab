name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate clean Android platform scaffold
        run: |
          mkdir -p /tmp/droidlab-preserve
          if [ -d android/app/src/main/kotlin/com/droidlab/app ]; then
            cp -R android/app/src/main/kotlin/com/droidlab/app /tmp/droidlab-preserve/kotlin
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/droidlab-preserve/AndroidManifest.xml
          fi
          flutter create --platforms=android --org=com.droidlab --project-name=app /tmp/droidlab-platform
          rm -rf android
          cp -R /tmp/droidlab-platform/android ./android
          if [ -d /tmp/droidlab-preserve/kotlin ]; then
            rm -rf android/app/src/main/kotlin/com/droidlab/app
            mkdir -p android/app/src/main/kotlin/com/droidlab
            cp -R /tmp/droidlab-preserve/kotlin android/app/src/main/kotlin/com/droidlab/app
          fi
          if [ -f /tmp/droidlab-preserve/AndroidManifest.xml ]; then
            cp /tmp/droidlab-preserve/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate typed platform bridge
        run: dart run pigeon --input pigeons/droidlab_api.dart

      - name: Format Dart sources
        run: dart format .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droidlab-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated Android and Pigeon sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add android lib/src/platform/droidlab_api.g.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: commit generated Android and Pigeon sources"
            git push
          fi
